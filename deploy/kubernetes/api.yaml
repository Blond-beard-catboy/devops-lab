apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-api-config
  namespace: travel-demo
  labels:
    app.kubernetes.io/name: travel-api
    app.kubernetes.io/part-of: travel-agency-demo
data:
  HTTP_ADDR: ":8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-api
  namespace: travel-demo
  labels:
    app.kubernetes.io/name: travel-api
    app.kubernetes.io/part-of: travel-agency-demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: travel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travel-api
        app.kubernetes.io/part-of: travel-agency-demo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: travel-agency-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: travel-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: travel-secrets
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: travel-api
  namespace: travel-demo
  labels:
    app.kubernetes.io/name: travel-api
    app.kubernetes.io/part-of: travel-agency-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: travel-api
  ports:
    - name: http
      port: 8080
      targetPort: http

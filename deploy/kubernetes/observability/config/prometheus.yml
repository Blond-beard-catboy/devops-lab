global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: travel-api
    metrics_path: /metrics
    static_configs:
      - targets: [travel-api:8080]
        labels:
          app: travel-api

groups:
  - name: travel-api
    rules:
      - alert: TravelAPIDown
        expr: up{job="travel-api"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Travel API is unavailable
          description: Prometheus has failed to scrape the Travel API for more than one minute.

      - alert: TravelAPIHigh5xxRate
        expr: sum(rate(http_requests_total{job="travel-api",status_code=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Travel API is returning server errors
          description: The Travel API has returned HTTP 5xx responses for more than two minutes.

      - alert: TravelAPIHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="travel-api"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Travel API p95 latency is high
          description: The 5-minute p95 HTTP latency is above 500 milliseconds.

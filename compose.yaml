services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://travel:${POSTGRES_PASSWORD:-travel-local-only}@db:5432/travel?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/travel-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
